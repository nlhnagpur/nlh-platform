<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NLH — Vibrant Dashboard</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  #root { min-height: 100vh; }

  /* ───────────────── sidebar ───────────────── */
  .sb {
    width: 232px;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sb-top {
    padding: 18px 16px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .sb-logo {
    width: 44px; height: 44px;
    border-radius: 11px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--sun-bg);
    box-shadow: 0 3px 10px rgba(245, 158, 11, .22);
  }
  .sb-logo img { width: 100%; height: 100%; object-fit: cover; }
  .sb-brand { flex: 1; min-width: 0; }
  .sb-name { font: 700 14px var(--font); line-height: 1.15; color: var(--text); letter-spacing: -.005em; }
  .sb-trust { font: 500 9px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; line-height: 1.3; }
  .sb-trust b { color: var(--purple); font-weight: 700; }
  .sb-env {
    position: absolute;
    top: 14px; right: 14px;
    font: 700 8.5px var(--mono);
    color: var(--purple);
    background: var(--purple-bg);
    padding: 3px 7px;
    border-radius: 20px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .sb-nav { padding: 12px 0 16px; flex: 1; overflow-y: auto; }
  .sect {
    font: 600 9px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: 14px 20px 6px;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 12px;
    margin: 1px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text2);
    cursor: pointer;
    transition: background .1s, color .1s;
    user-select: none;
    line-height: 1.2;
  }
  .nav-ic {
    width: 22px; height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    background: var(--bg3);
    transition: background .15s, transform .15s;
  }
  .nav:hover { background: var(--bg3); color: var(--text); }
  .nav:hover .nav-ic { background: #fff; transform: scale(1.05); }
  .nav.on {
    background: linear-gradient(135deg, #534AB7 0%, #6F66CC 100%);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(83, 74, 183, .25);
  }
  .nav.on .nav-ic { background: rgba(255, 255, 255, .22); }
  .nav-bdg {
    margin-left: auto;
    background: var(--orange-2);
    color: #fff;
    font: 700 9px var(--mono);
    padding: 2px 7px;
    border-radius: 20px;
    line-height: 1.3;
  }
  .nav.on .nav-bdg { background: rgba(255,255,255,.25); color: #fff; }
  .sb-watermark {
    padding: 10px 16px 6px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sb-wm-ic {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--sun-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .sb-wm-text {
    font: 500 9px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .06em;
    line-height: 1.35;
  }
  .sb-wm-text b { color: var(--text2); font-weight: 700; }
  .sb-foot {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .av {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sun) 0%, var(--orange-2) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 11px var(--font);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(234, 88, 12, .25);
  }
  .av-name { font: 600 12px var(--font); color: var(--text); }
  .av-role { font: 500 9px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

  /* ───────────────── main ───────────────── */
  .app { display: flex; min-height: 100vh; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .tb {
    height: 60px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: sticky; top: 0;
    z-index: 20;
  }
  .crumb { font-size: 13px; color: var(--text2); }
  .crumb b { color: var(--text); font-weight: 600; }
  .crumb .sep { color: var(--text3); margin: 0 6px; }
  .tb-r { display: flex; align-items: center; gap: 10px; }
  .search {
    padding: 8px 14px 8px 36px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%239C9A92' stroke-width='2' stroke-linecap='round'><circle cx='6' cy='6' r='4.5'/><path d='M9.5 9.5L13 13'/></svg>") no-repeat 12px center;
    font: 400 12.5px var(--font);
    width: 280px;
    color: var(--text);
    outline: none;
    transition: all .12s;
  }
  .search:focus { border-color: var(--purple); background-color: #fff; box-shadow: 0 0 0 3px rgba(83,74,183,.1); }
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    font: 500 12px var(--font);
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
    line-height: 1.2;
  }
  .btn-p { background: var(--purple); color: #fff; }
  .btn-p:hover { background: var(--purple2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(83,74,183,.3); }
  .btn-s { background: #fff; border: 1px solid var(--border2); color: var(--text); }
  .btn-s:hover { background: var(--bg3); }

  /* ───────────────── content scroll area ───────────────── */
  .content {
    padding: 22px 28px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ───────────────── greeting hero strip ───────────────── */
  .hero {
    position: relative;
    border-radius: 20px;
    padding: 24px 28px;
    background: linear-gradient(115deg, #FFF6D9 0%, #FFE89B 38%, #FFD974 68%, #FFC053 100%);
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(245, 158, 11, .14);
    display: flex;
    align-items: center;
    gap: 24px;
    min-height: 140px;
  }
  .hero::before {
    content: '';
    position: absolute;
    right: -60px; top: -100px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, #FFFAE0 0%, #FFE89B 50%, transparent 75%);
    pointer-events: none;
  }
  .hero-l { position: relative; flex: 1; min-width: 0; }
  .hero-eyebrow {
    font: 500 10px var(--mono);
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .hero-eyebrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green-2);
    box-shadow: 0 0 0 4px rgba(22,163,74,.18);
  }
  .hero-title {
    font: 700 26px var(--font);
    color: var(--blue-deep);
    line-height: 1.15;
    letter-spacing: -.01em;
    margin: 0 0 6px;
  }
  .hero-sub {
    font: 400 13.5px var(--font);
    color: #5B4A1F;
    line-height: 1.5;
    max-width: 540px;
  }
  .hero-sub b { color: var(--blue-deep); font-weight: 600; }
  .hero-chips {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hero-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px 6px 8px;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 24px;
    font: 500 11px var(--font);
    color: var(--text);
  }
  .hero-chip .em {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .hero-chip b { font-weight: 700; color: var(--text); }
  .hero-r {
    position: relative;
    flex-shrink: 0;
    width: 220px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mascot-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin-top: -10px;
    margin-bottom: -30px;
    z-index: 2;
    filter: drop-shadow(0 12px 24px rgba(217, 119, 6, .35));
  }
  .mascot-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: mascot-bob 4.5s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  .hero-confetti { position: absolute; pointer-events: none; }
  .hero-confetti.c1 { top: 8px; left: 10%; }
  .hero-confetti.c2 { top: 20px; right: 18%; }
  .hero-confetti.c3 { bottom: 14px; left: 30%; }
  .hero-confetti.c4 { bottom: 18px; right: 28%; }

  /* ───────────────── KPI cards ───────────────── */
  .kpi {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .kc {
    position: relative;
    border-radius: 18px;
    padding: 18px 20px 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    min-height: 158px;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }
  .kc:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0,0,0,.10); }
  .kc::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .2);
    z-index: 0;
  }
  .kc::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    z-index: 0;
  }
  .kc-1 { background: linear-gradient(135deg, #534AB7 0%, #7F77DD 100%); color: #fff; }
  .kc-2 { background: linear-gradient(135deg, #16A34A 0%, #34D399 100%); color: #fff; }
  .kc-3 { background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%); color: #5B3A00; }
  .kc-4 { background: linear-gradient(135deg, #DB2777 0%, #F472B6 100%); color: #fff; }
  .kc-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  .kc-ic {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: rgba(255, 255, 255, .25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    backdrop-filter: blur(4px);
  }
  .kc-3 .kc-ic { background: rgba(255,255,255,.45); }
  .kc-arr {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: transform .2s;
    backdrop-filter: blur(4px);
  }
  .kc-3 .kc-arr { background: rgba(255,255,255,.45); }
  .kc:hover .kc-arr { transform: rotate(45deg); }
  .kc-num {
    font: 700 32px var(--font);
    line-height: 1.05;
    letter-spacing: -.01em;
    position: relative;
    z-index: 1;
  }
  .kc-lbl {
    font: 500 12.5px var(--font);
    opacity: .9;
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }
  .kc-sub {
    font: 500 10px var(--mono);
    opacity: .75;
    margin-top: 10px;
    position: relative;
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .kc-sub .delta {
    background: rgba(255,255,255,.25);
    padding: 1px 7px;
    border-radius: 20px;
    margin-right: 6px;
    font-weight: 700;
  }
  .kc-3 .kc-sub .delta { background: rgba(91, 58, 0, .15); color: #5B3A00; }

  /* ───────────────── programs strip ───────────────── */
  .programs-card {
    background: #fff;
    border-radius: 18px;
    border: 1px solid var(--border);
    padding: 18px 22px 20px;
    box-shadow: var(--shadow);
  }
  .pc-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .pc-title {
    font: 600 15px var(--font);
    color: var(--text);
    line-height: 1.2;
  }
  .pc-sub {
    font: 500 10px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: 4px;
  }
  .pc-link {
    font: 500 11px var(--mono);
    color: var(--purple);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .pc-link:hover { color: var(--purple2); }
  .programs {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
  }
  .prog {
    position: relative;
    background: var(--bg);
    border-radius: 14px;
    padding: 14px 10px 12px;
    text-align: center;
    cursor: pointer;
    transition: all .18s ease;
    border: 1px solid transparent;
    overflow: hidden;
  }
  .prog:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.06);
    border-color: rgba(0,0,0,.04);
  }
  .prog-em {
    width: 42px; height: 42px;
    margin: 0 auto 8px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .prog-name {
    font: 600 11px var(--font);
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .prog-count {
    font: 500 10px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .prog-count b { color: var(--text); font-weight: 700; }

  /* program color variants */
  .pe-1 { background: #DBEAFE; color: #2563EB; }
  .pe-2 { background: #DCFCE7; color: #16A34A; }
  .pe-3 { background: #FEF3C7; color: #D97706; }
  .pe-4 { background: #FCE7F3; color: #DB2777; }
  .pe-5 { background: #E9D5FF; color: #7C3AED; }
  .pe-6 { background: #BAE6FD; color: #0284C7; }
  .pe-7 { background: #FED7AA; color: #EA580C; }
  .pe-8 { background: #FECDD3; color: #E11D48; }

  /* ───────────────── two-col row ───────────────── */
  .row {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card-h {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-t { font: 600 14px var(--font); color: var(--text); }
  .card-ts { font: 500 10px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
  .card-link {
    font: 500 11px var(--mono);
    color: var(--purple);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .05em;
    background: var(--purple-bg);
    padding: 5px 10px;
    border-radius: 20px;
    transition: all .15s;
  }
  .card-link:hover { background: var(--purple); color: #fff; }

  /* ───────────────── chart card ───────────────── */
  .chart-card { padding: 18px 22px 22px; }
  .chart-tabs {
    display: inline-flex;
    background: var(--bg3);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .chart-tab {
    padding: 6px 14px;
    font: 500 11px var(--font);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text2);
    border-radius: 6px;
    transition: all .12s;
  }
  .chart-tab.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chart-tab:hover:not(.on) { color: var(--text); }
  .chart-stats {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-top: 12px;
    margin-bottom: 12px;
  }
  .chart-big {
    font: 700 30px var(--font);
    color: var(--text);
    letter-spacing: -.01em;
    line-height: 1;
  }
  .chart-delta {
    font: 600 12px var(--font);
    color: var(--green);
    background: var(--green-bg);
    padding: 3px 9px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chart-context { font: 500 11px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .04em; }
  .chart-svg { width: 100%; height: 200px; display: block; }

  /* ───────────────── activity feed ───────────────── */
  .act { padding: 8px 0; }
  .act-i {
    display: flex;
    gap: 12px;
    padding: 10px 18px;
    transition: background .12s;
    cursor: pointer;
    align-items: flex-start;
  }
  .act-i:hover { background: var(--bg); }
  .act-em {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .act-body { flex: 1; min-width: 0; }
  .act-title { font: 500 12.5px var(--font); color: var(--text); line-height: 1.4; }
  .act-title b { font-weight: 600; }
  .act-meta {
    font: 500 10px var(--mono);
    color: var(--text3);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .act-meta .am-pill {
    display: inline-block;
    background: var(--bg3);
    padding: 1px 7px;
    border-radius: 20px;
    margin-right: 6px;
    color: var(--text2);
  }

  /* ───────────────── orders table ───────────────── */
  .tbl { width: 100%; border-collapse: collapse; font: 400 12.5px var(--font); }
  .tbl th {
    text-align: left;
    font: 600 10px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 18px;
    background: var(--bg);
    border-bottom: 2px solid var(--border);
  }
  .tbl td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: #FAFAF8; }
  .tbl .mono { font: 500 11.5px var(--mono); color: var(--text2); }
  .placer-cell { display: flex; align-items: center; gap: 9px; }
  .placer-av {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 10px var(--font);
    flex-shrink: 0;
    color: #fff;
  }
  .placer-name { font: 500 12.5px var(--font); color: var(--text); }
  .placer-loc { font: 500 10px var(--mono); color: var(--text3); margin-top: 1px; text-transform: uppercase; letter-spacing: .04em; }

  .bdg {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font: 600 10.5px var(--mono);
    text-transform: lowercase;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .bdg .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .bdg-paid { background: var(--green-bg); color: var(--green); }
  .bdg-pend { background: var(--amber-bg); color: var(--amber); }
  .bdg-inv  { background: var(--blue-bg); color: var(--blue2); }
  .bdg-over { background: var(--red-bg); color: var(--red); }
  .bdg-pmt  { background: var(--purple-bg); color: var(--purple); }

  .tier {
    font: 700 9px var(--mono);
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: .04em;
  }
  .t-uf { background: rgba(37,99,235,.13); color: var(--blue); }
  .t-cf { background: rgba(22,163,74,.13); color: var(--green-2); }
  .t-smf{ background: rgba(217,119,6,.16); color: var(--orange); }

  .amt { font: 600 12.5px var(--mono); color: var(--text); text-align: right; }
  .amt-sub { font: 500 9.5px var(--mono); color: var(--text3); text-align: right; margin-top: 2px; letter-spacing: .04em; }

  /* ───────────────── top franchisees ───────────────── */
  .topf { padding: 10px 0; }
  .topf-i {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    transition: background .12s;
    cursor: pointer;
  }
  .topf-i:hover { background: var(--bg); }
  .topf-rank {
    width: 28px; height: 28px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 11px var(--mono);
    flex-shrink: 0;
  }
  .topf-rank.r1 { background: linear-gradient(135deg, #FCD34D, #F59E0B); color: #5B3A00; }
  .topf-rank.r2 { background: var(--bg3); color: var(--text2); }
  .topf-rank.r3 { background: var(--bg3); color: var(--text2); }
  .topf-rank.r4 { background: var(--bg3); color: var(--text3); }
  .topf-rank.r5 { background: var(--bg3); color: var(--text3); }
  .topf-body { flex: 1; min-width: 0; }
  .topf-name { font: 600 12.5px var(--font); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topf-meta { font: 500 10px var(--mono); color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .topf-bar {
    height: 6px;
    background: var(--bg3);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 6px;
  }
  .topf-bar-fill {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--purple) 0%, #7F77DD 100%);
  }
  .topf-r1 .topf-bar-fill { background: linear-gradient(90deg, var(--sun) 0%, var(--orange-2) 100%); }
  .topf-r2 .topf-bar-fill { background: linear-gradient(90deg, var(--blue) 0%, #60A5FA 100%); }
  .topf-r3 .topf-bar-fill { background: linear-gradient(90deg, var(--green-2) 0%, #6EE7B7 100%); }
  .topf-r4 .topf-bar-fill { background: linear-gradient(90deg, var(--pink) 0%, #F472B6 100%); }
  .topf-r5 .topf-bar-fill { background: linear-gradient(90deg, var(--violet) 0%, #A78BFA 100%); }
  .topf-num { font: 700 14px var(--font); color: var(--text); flex-shrink: 0; }

  /* ───────────────── tier breakdown card ───────────────── */
  .tier-card { padding: 18px 22px; }
  .tier-rows { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .tier-row { display: flex; align-items: center; gap: 12px; }
  .tier-swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .tier-name { font: 600 12px var(--font); color: var(--text); width: 130px; }
  .tier-bar { flex: 1; height: 8px; background: var(--bg3); border-radius: 20px; overflow: hidden; }
  .tier-bar-fill { height: 100%; border-radius: 20px; }
  .tier-cnt { font: 700 13px var(--mono); color: var(--text); width: 28px; text-align: right; }
  .tier-pct { font: 500 10px var(--mono); color: var(--text3); width: 36px; text-align: right; letter-spacing: .04em; }

  .donut-wrap { display: flex; align-items: center; gap: 22px; padding: 6px 0 8px; }
  .donut { width: 124px; height: 124px; flex-shrink: 0; position: relative; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .donut-big { font: 700 26px var(--font); color: var(--text); line-height: 1; letter-spacing: -.01em; }
  .donut-lbl { font: 500 9px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
  .donut-side { flex: 1; }

  /* ───────────────── pulse animation ───────────────── */
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: .4; }
  }
  @keyframes nlh-bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-3px) rotate(2deg); }
  }
  @keyframes mascot-bob {
    0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
    50%      { transform: translateY(-6px) rotate(3deg) scale(1.02); }
  }
  @keyframes mascot-sparkle {
    0%, 100% { opacity: .3; transform: scale(.85) rotate(0deg); }
    50%      { opacity: 1;  transform: scale(1.15) rotate(180deg); }
  }
  .hero-r .spk {
    position: absolute;
    z-index: 1;
    animation: mascot-sparkle 2.4s ease-in-out infinite;
  }
  .hero-r .spk-1 { top: 6px;  left: 6px;  animation-delay: 0s; }
  .hero-r .spk-2 { top: 18px; right: 8px; animation-delay: .6s; }
  .hero-r .spk-3 { bottom: 36px; left: -4px; animation-delay: 1.2s; }
  .hero-r .spk-4 { bottom: 16px; right: 0;   animation-delay: 1.8s; }
  .live-dot {
    width: 8px; height: 8px;
    background: var(--green-2);
    border-radius: 50%;
    position: relative;
  }
  .live-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--green-2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  /* ───────────────── empty / micro ───────────────── */
  .h-sec {
    font: 600 11px var(--mono);
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 4px 0 -4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .h-sec::after {
    content: '';
    height: 1px;
    background: var(--border);
    flex: 1;
  }

  /* ════════════════════════════════════════════════════════════════
     PAGE HEADER (used on all tabs)
     ════════════════════════════════════════════════════════════════ */
  .ph {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 4px 0 0;
  }
  .ph-l { flex: 1; min-width: 0; }
  .ph-eyebrow {
    font: 600 10px var(--mono);
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ph-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
  .ph-title { font: 700 26px var(--font); color: var(--text); letter-spacing: -.015em; line-height: 1.1; }
  .ph-sub { font: 400 13px var(--font); color: var(--text2); margin-top: 4px; line-height: 1.5; max-width: 640px; }
  .ph-sub b { color: var(--text); font-weight: 600; }
  .ph-r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  /* ─── mini stat tiles (used in Franchisees, Invoices, Students) ─── */
  .mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .mini { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .mini-ic { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 8px; }
  .mini-num { font: 700 24px var(--font); color: var(--text); letter-spacing: -.01em; line-height: 1; }
  .mini-lbl { font: 500 11px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .mini-delta { font: 500 10px var(--mono); color: var(--green); margin-top: 4px; letter-spacing: .03em; }
  .mini-delta.red { color: var(--red); }
  .mini-delta.amber { color: var(--amber); }

  /* ════════════════════════════════════════════════════════════════
     FRANCHISEE CARDS
     ════════════════════════════════════════════════════════════════ */
  .fr-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .fr-search { flex: 1; padding: 8px 14px 8px 34px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg); font: 400 12.5px var(--font); color: var(--text); outline: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%239C9A92' stroke-width='2' stroke-linecap='round'><circle cx='6' cy='6' r='4.5'/><path d='M9.5 9.5L13 13'/></svg>"); background-repeat: no-repeat; background-position: 12px center; }
  .fr-search:focus { border-color: var(--purple); background-color: #fff; box-shadow: 0 0 0 3px rgba(83,74,183,.1); }
  .fr-tabs { display: inline-flex; background: var(--bg3); border-radius: 8px; padding: 3px; gap: 2px; }
  .fr-tab { padding: 6px 14px; font: 600 11px var(--mono); background: transparent; border: none; cursor: pointer; color: var(--text2); border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; transition: all .12s; display: inline-flex; align-items: center; gap: 6px; }
  .fr-tab:hover:not(.on) { color: var(--text); }
  .fr-tab.on { background: #fff; color: var(--purple); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .fr-tab .ct { font: 700 9px var(--mono); padding: 1px 6px; border-radius: 20px; background: var(--bg3); color: var(--text2); }
  .fr-tab.on .ct { background: var(--purple-bg); color: var(--purple); }

  .fr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 1200px) { .fr-grid { grid-template-columns: repeat(2, 1fr); } }
  .fr-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); transition: all .18s; cursor: pointer; position: relative; overflow: hidden; }
  .fr-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.08); border-color: rgba(83,74,183,.18); }
  .fr-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
  .fr-card.smf::before { background: linear-gradient(90deg, var(--sun), var(--orange-2)); }
  .fr-card.cf::before  { background: linear-gradient(90deg, var(--green-2), #6EE7B7); }
  .fr-card.uf::before  { background: linear-gradient(90deg, var(--blue), #60A5FA); }
  .fr-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .fr-av { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font: 700 16px var(--font); color: #fff; flex-shrink: 0; }
  .fr-name { font: 700 14px var(--font); color: var(--text); line-height: 1.2; }
  .fr-loc { font: 500 10px var(--mono); color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
  .fr-badge-row { display: flex; gap: 6px; margin-top: 6px; }
  .fr-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .fr-stat { text-align: left; }
  .fr-stat-num { font: 700 16px var(--font); color: var(--text); letter-spacing: -.01em; }
  .fr-stat-lbl { font: 500 9px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
  .fr-card-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); }
  .fr-since { font: 500 10px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .04em; }
  .fr-active { display: inline-flex; align-items: center; gap: 5px; font: 600 10px var(--mono); color: var(--green); text-transform: uppercase; letter-spacing: .05em; }
  .fr-active .d { width: 6px; height: 6px; border-radius: 50%; background: var(--green-2); }
  .fr-dormant { color: var(--text3); }
  .fr-dormant .d { background: var(--text3); }

  /* ════════════════════════════════════════════════════════════════
     ORDERS PAGE — status pills + table
     ════════════════════════════════════════════════════════════════ */
  .status-pills { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 16px; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .sp { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 24px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; transition: all .12s; border: 1px solid transparent; background: var(--bg3); color: var(--text2); }
  .sp:hover { background: var(--bg4); color: var(--text); }
  .sp .ct { background: rgba(0,0,0,.08); padding: 1px 7px; border-radius: 20px; font-weight: 700; font-size: 9.5px; }
  .sp.on.all     { background: var(--text); color: #fff; }
  .sp.on.pending { background: var(--amber-bg); color: var(--amber); border-color: rgba(138,82,0,.25); }
  .sp.on.inv     { background: var(--blue-bg); color: var(--blue2); border-color: rgba(26,95,168,.2); }
  .sp.on.pmt     { background: var(--purple-bg); color: var(--purple); border-color: rgba(83,74,183,.25); }
  .sp.on.closed  { background: var(--green-bg); color: var(--green); border-color: rgba(29,122,79,.25); }
  .sp.on.over    { background: var(--red-bg); color: var(--red); border-color: rgba(163,45,45,.2); }
  .sp.on .ct { background: rgba(255,255,255,.35); }
  .sp.on.all .ct { background: rgba(255,255,255,.2); color: #fff; }

  /* big table */
  .big-tbl { width: 100%; border-collapse: collapse; font: 400 12.5px var(--font); }
  .big-tbl th { text-align: left; font: 600 10px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 12px 18px; background: var(--bg); border-bottom: 2px solid var(--border); }
  .big-tbl td { padding: 14px 18px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .big-tbl tr:last-child td { border-bottom: none; }
  .big-tbl tr:hover td { background: #FAFAF8; }
  .big-tbl .mono { font-family: var(--mono); font-size: 11.5px; color: var(--text2); font-weight: 500; }

  .row-action {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 7px;
    font: 600 10.5px var(--mono);
    text-transform: uppercase;
    letter-spacing: .05em;
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text2);
    cursor: pointer;
    transition: all .12s;
    margin-right: 4px;
  }
  .row-action:hover { background: var(--purple-bg); color: var(--purple); border-color: rgba(83,74,183,.3); }
  .row-action.primary { background: var(--purple); color: #fff; border-color: var(--purple); }
  .row-action.primary:hover { background: var(--purple2); }
  .row-action.green { background: var(--green-bg); color: var(--green); border-color: rgba(29,122,79,.25); }
  .row-action.green:hover { background: var(--green); color: #fff; }

  /* ════════════════════════════════════════════════════════════════
     INVOICES — big outstanding hero + table
     ════════════════════════════════════════════════════════════════ */
  .inv-hero {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 14px;
  }
  .inv-hero-l {
    background: linear-gradient(135deg, #534AB7 0%, #6F66CC 100%);
    color: #fff;
    border-radius: 18px;
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .inv-hero-l::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .inv-hero-l::after  { content: ''; position: absolute; bottom: -40px; left: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .inv-hero-l .lbl { font: 600 10px var(--mono); opacity: .85; text-transform: uppercase; letter-spacing: .1em; position: relative; }
  .inv-hero-l .big { font: 800 44px var(--font); letter-spacing: -.015em; line-height: 1; margin-top: 6px; position: relative; }
  .inv-hero-l .big .cur { font-size: 22px; font-weight: 700; opacity: .85; margin-right: 6px; }
  .inv-hero-l .sub { font: 500 12px var(--mono); opacity: .85; margin-top: 8px; text-transform: uppercase; letter-spacing: .05em; position: relative; }
  .inv-hero-l .actions { display: flex; gap: 8px; margin-top: 16px; position: relative; }
  .inv-hero-l .actions button { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.25); padding: 8px 14px; border-radius: 8px; font: 600 11px var(--mono); cursor: pointer; text-transform: uppercase; letter-spacing: .05em; transition: all .15s; }
  .inv-hero-l .actions button:hover { background: rgba(255,255,255,.28); }
  .inv-hero-l .actions button.solid { background: #fff; color: var(--purple); border-color: #fff; }
  .inv-hero-l .actions button.solid:hover { background: var(--sun-bg); }

  .inv-hero-r {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .inv-hero-r .h { font: 600 14px var(--font); color: var(--text); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .inv-bar-row { display: flex; align-items: center; gap: 10px; }
  .inv-bar-lbl { font: 500 10px var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: .05em; width: 64px; flex-shrink: 0; }
  .inv-bar { flex: 1; height: 8px; background: var(--bg3); border-radius: 20px; overflow: hidden; }
  .inv-bar-fill { height: 100%; border-radius: 20px; }
  .inv-bar-fill.paid { background: linear-gradient(90deg, var(--green-2), #6EE7B7); }
  .inv-bar-fill.unpaid { background: linear-gradient(90deg, var(--amber), var(--sun)); }
  .inv-bar-fill.over { background: linear-gradient(90deg, var(--red), #FCA5A5); }
  .inv-bar-num { font: 700 12px var(--mono); color: var(--text); width: 32px; text-align: right; }

  /* ════════════════════════════════════════════════════════════════
     STUDENTS — per-program rail + table
     ════════════════════════════════════════════════════════════════ */
  .prog-rail { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .prog-mini { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer; transition: all .15s; }
  .prog-mini:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.06); }
  .prog-mini-em { width: 38px; height: 38px; margin: 0 auto 6px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .prog-mini-name { font: 600 10px var(--font); color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-mini-cnt { font: 700 11px var(--mono); color: var(--purple); margin-top: 3px; }

  .stu-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font: 600 10px var(--mono);
    margin-right: 4px;
    margin-bottom: 2px;
  }
  .stu-chip-1 { background: #DBEAFE; color: #2563EB; }
  .stu-chip-2 { background: #DCFCE7; color: #16A34A; }
  .stu-chip-3 { background: #FEF3C7; color: #D97706; }
  .stu-chip-4 { background: #FCE7F3; color: #DB2777; }
  .stu-chip-5 { background: #E9D5FF; color: #7C3AED; }
  .stu-chip-6 { background: #BAE6FD; color: #0284C7; }
  .stu-chip-7 { background: #FED7AA; color: #EA580C; }
  .stu-chip-8 { background: #FECDD3; color: #E11D48; }

  .level-bdg { display: inline-flex; padding: 2px 7px; border-radius: 6px; font: 700 9px var(--mono); background: var(--purple-bg); color: var(--purple); margin-left: 4px; letter-spacing: .04em; }

  /* ════════════════════════════════════════════════════════════════
     KIT PRICES — program rail + matrix table
     ════════════════════════════════════════════════════════════════ */
  .prices-layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  @media (max-width: 1100px) { .prices-layout { grid-template-columns: 1fr; } }

  .prices-rail { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); height: fit-content; max-height: 580px; overflow-y: auto; }
  .prices-rail-h { font: 600 10px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .08em; padding: 10px 12px 6px; }
  .prices-rail-i { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .prices-rail-i:hover { background: var(--bg); }
  .prices-rail-i.on { background: var(--purple-bg); }
  .prices-rail-em { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .prices-rail-name { font: 600 12px var(--font); color: var(--text); line-height: 1.2; }
  .prices-rail-sub { font: 500 10px var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .prices-rail-i.on .prices-rail-name { color: var(--purple); }

  .prices-main { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
